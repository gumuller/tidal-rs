name: Arch Linux release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_HOME: /tmp/tidal-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Install build and runtime dependencies
        run: pacman -Syu --noconfirm --needed git rust cargo rustfmt cmake python gtk4 mpv libpulse xdg-utils github-cli
      - uses: actions/checkout@v4
      - name: Build and check as an unprivileged user
        run: |
          useradd -m builder
          mkdir -p "$CARGO_HOME"
          chown -R builder:builder "$GITHUB_WORKSPACE" "$CARGO_HOME"
          runuser -u builder -- bash -c 'cargo fmt --check && cargo test --locked && scripts/package-release.sh'
      - name: Build Arch package from the published tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --nodeps --noconfirm'
          cp packaging/arch/*.pkg.tar.zst dist/
          cd dist
          sha256sum *.tar.gz *.pkg.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tidal-rs-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "TIDAL Rust $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*.tar.gz dist/*.pkg.tar.zst dist/SHA256SUMS --clobber
